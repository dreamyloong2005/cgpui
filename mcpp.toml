# cgpui workspace. Libraries live in packages/<name>/mcpp.toml and compile
# the sources in src/ in place; examples in examples/*/mcpp.toml; tests in
# tests/<suite>/mcpp.toml; vendored dependencies in third_party/*/mcpp.toml.
# Build and test through scripts/dev/build.* and scripts/dev/test.* (they set
# MCPP_HOME, VSLANG and the static CRT); see docs/getting-started.md.
[workspace]
members = [
    "third_party/plutovg",
    "third_party/lunasvg",
    "packages/core",
    "packages/platform",
    "packages/platform-fallback",
    "packages/platform-win32",
    "packages/platform-linux-atspi",
    "packages/platform-linux-x11",
    "packages/platform-linux-wayland",
    "packages/renderer",
    "packages/renderer-fallback",
    "packages/renderer-vulkan",
    "packages/ui",
    "packages/app",
    "examples/hello_window",
    "examples/backdrop_blur",
    "examples/client_title_bar",
    "examples/workbench",
    "examples/api_parity",
]

[workspace.package]
mcpp = ">=2026.11.18.1"
standard = "c++23"

[workspace.toolchain]
windows = "msvc@system"
linux = { path = "/usr" }

# Builds and tests use the static C++ runtime: /MT on Windows, and mcpp's
# default -static-libstdc++ on Linux. `mcpp test` has no --static and the CRT
# is one setting for the whole graph, so it is stated here;
# scripts/ci/sdk-package.py builds the Windows SDK with the dynamic CRT (/MD).
[workspace.build]
cxx_runtime = "self-contained"

[workspace.target.'cfg(os = "windows")'.build]
cxxflags = ["/Zc:__cplusplus"]

# Linux test builds: line tables only (-g1). Full -g debug information for
# ~560 test programs once filled the WSL disk; scripts/dev/*.sh use this.
[workspace.profile.dev-lines]
debug = "lines"
