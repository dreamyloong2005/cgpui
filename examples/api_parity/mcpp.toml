# The API parity examples: one program per directory, console subsystem.
# Four of them are also test programs (they check their own output and exit
# non-zero on a mismatch); scripts/ci/*-example-smoke.* run all of them.
[package]
namespace = "cgpui"
name = "api-parity-examples"
version = "0.1.0"

[dependencies]
cgpui.core = { path = "../../packages/core" }
cgpui.platform = { path = "../../packages/platform" }
cgpui.renderer = { path = "../../packages/renderer" }
cgpui.ui = { path = "../../packages/ui" }
cgpui.app = { path = "../../packages/app" }

[target.'cfg(os = "windows")'.dependencies]
cgpui.platform-win32 = { path = "../../packages/platform-win32" }
cgpui.renderer-vulkan = { path = "../../packages/renderer-vulkan" }

[target.'cfg(os = "linux")'.dependencies]
cgpui.platform-linux-wayland = { path = "../../packages/platform-linux-wayland" }
cgpui.renderer-vulkan = { path = "../../packages/renderer-vulkan" }

[target.'cfg(os = "macos")'.dependencies]
cgpui.platform-macos = { path = "../../packages/platform-macos" }
cgpui.renderer-metal = { path = "../../packages/renderer-metal" }

[build]
sources = []

[test]
# One glob, so the names keep their directory (public_image_example/main).
discover = ["public_{animation,gif_viewer,image,opacity}_example/main.cpp"]

[targets.api_parity_hello_world]
kind = "bin"
main = "hello_world/main.cpp"

[targets.api_parity_public_animation_example]
kind = "bin"
main = "public_animation_example/main.cpp"

[targets.api_parity_public_api_compatibility]
kind = "bin"
main = "public_api_compatibility/main.cpp"

[targets.api_parity_public_async_test_workflow]
kind = "bin"
main = "public_async_test_workflow/main.cpp"

[targets.api_parity_public_authoring_workflow]
kind = "bin"
main = "public_authoring_workflow/main.cpp"

[targets.api_parity_public_context_capabilities]
kind = "bin"
main = "public_context_capabilities/main.cpp"

[targets.api_parity_public_gif_viewer_example]
kind = "bin"
main = "public_gif_viewer_example/main.cpp"

[targets.api_parity_public_image_example]
kind = "bin"
