name: Setup mcpp
description: Install the pinned mcpp release and expose it as MCPP / MCPP_HOME.

# Release tags are v<version>; archive digests come from the release's .sha256.
runs:
  using: composite
  steps:
    - name: Install mcpp 2026.11.21.1 (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $version = "2026.11.21.1"
        $archive = Join-Path $env:RUNNER_TEMP "mcpp-windows-x86_64.zip"
        Invoke-WebRequest -Uri "https://github.com/mcpp-community/mcpp/releases/download/v$version/mcpp-windows-x86_64.zip" -OutFile $archive
        $digest = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
        if ($digest -ne "a39c91c15f082458210e76874ed6ee88b3402c357ac723fb2faa12c2b82bcff4") { throw "mcpp archive digest mismatch: $digest" }
        $root = Join-Path $env:RUNNER_TEMP "mcpp"
        Expand-Archive -LiteralPath $archive -DestinationPath $root
        $mcpp = (Get-ChildItem -LiteralPath $root -Recurse -Filter mcpp.exe | Select-Object -First 1).FullName
        "MCPP=$mcpp" >> $env:GITHUB_ENV
        "MCPP_HOME=$(Join-Path $env:RUNNER_TEMP 'mcpp-home')" >> $env:GITHUB_ENV
    - name: Install mcpp 2026.11.21.1 (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail
        version=2026.11.21.1
        archive="$RUNNER_TEMP/mcpp-linux-x86_64.tar.gz"
        curl -fsSL -o "$archive" "https://github.com/mcpp-community/mcpp/releases/download/v$version/mcpp-linux-x86_64.tar.gz"
        echo "bafefffb6651b47e3e1be0c85f12df091a9e60d8f635537c6812295dc2327ac2  $archive" | sha256sum -c -
        mkdir -p "$RUNNER_TEMP/mcpp" && tar -xzf "$archive" -C "$RUNNER_TEMP/mcpp"
        echo "MCPP=$(find "$RUNNER_TEMP/mcpp" -type f -name mcpp -perm -u+x | head -1)" >> "$GITHUB_ENV"
        echo "MCPP_HOME=$RUNNER_TEMP/mcpp-home" >> "$GITHUB_ENV"
    - name: Locate the Mach-O linker used for mcpp host build programs
      if: runner.os == 'macOS' && runner.arch == 'ARM64'
      shell: bash
      run: |
        set -euo pipefail
        command -v ld64.lld >/dev/null && exit 0
        if command -v rustc >/dev/null; then
          host=$(rustc -vV | sed -n 's/^host: //p')
          bin="$(rustc --print sysroot)/lib/rustlib/$host/bin/gcc-ld"
          if [[ -x "$bin/ld64.lld" ]]; then echo "$bin" >> "$GITHUB_PATH"; exit 0; fi
        fi
        brew install lld
        bin="$(brew --prefix lld)/bin"
        test -x "$bin/ld64.lld" && echo "$bin" >> "$GITHUB_PATH"
    # The pinned mcpp binary runs on Apple Silicon (macOS 14 or later).
    - name: Install mcpp 2026.11.21.1 (macOS arm64)
      if: runner.os == 'macOS' && runner.arch == 'ARM64'
      shell: bash
      run: |
        set -euo pipefail
        version=2026.11.21.1
        archive="$RUNNER_TEMP/mcpp-macosx-arm64.tar.gz"
        curl -fsSL -o "$archive" "https://github.com/mcpp-community/mcpp/releases/download/v$version/mcpp-macosx-arm64.tar.gz"
        echo "9d535e4f89dc63f58d122527b4441f46c52fe6b4d5b386f3672494b10c55a35d  $archive" | shasum -a 256 -c -
        mkdir -p "$RUNNER_TEMP/mcpp" && tar -xzf "$archive" -C "$RUNNER_TEMP/mcpp"
        echo "MCPP=$(find "$RUNNER_TEMP/mcpp" -type f -name mcpp -perm -u+x | head -1)" >> "$GITHUB_ENV"
        echo "MCPP_HOME=$RUNNER_TEMP/mcpp-home" >> "$GITHUB_ENV"
    - name: Reject unsupported macOS runner
      if: runner.os == 'macOS' && runner.arch != 'ARM64'
      shell: bash
      run: |
        echo "::error::CGPUI supports only native arm64 on macOS; this runner is $RUNNER_ARCH"
        exit 1
