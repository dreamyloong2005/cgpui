name: Setup mcpp
description: Install the pinned mcpp release and expose it as MCPP / MCPP_HOME.

# Not exercised since the mcpp migration: the workflows have not run on
# GitHub (verified locally with the same mcpp release only).
runs:
  using: composite
  steps:
    - name: Install mcpp 2026.11.18.1 (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $version = "2026.11.18.1"
        $archive = Join-Path $env:RUNNER_TEMP "mcpp-windows-x86_64.zip"
        Invoke-WebRequest -Uri "https://github.com/mcpp-community/mcpp/releases/download/$version/mcpp-windows-x86_64.zip" -OutFile $archive
        $digest = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
        if ($digest -ne "0800f2a7f3979c35f7c5a8f24c3470c8fdc8d53cdcd93b3faf0c9800b4502e42") { throw "mcpp archive digest mismatch: $digest" }
        $root = Join-Path $env:RUNNER_TEMP "mcpp"
        Expand-Archive -LiteralPath $archive -DestinationPath $root
        $mcpp = (Get-ChildItem -LiteralPath $root -Recurse -Filter mcpp.exe | Select-Object -First 1).FullName
        "MCPP=$mcpp" >> $env:GITHUB_ENV
        "MCPP_HOME=$(Join-Path $env:RUNNER_TEMP 'mcpp-home')" >> $env:GITHUB_ENV
    - name: Install mcpp 2026.11.18.1 (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail
        version=2026.11.18.1
        archive="$RUNNER_TEMP/mcpp-linux-x86_64.tar.gz"
        curl -fsSL -o "$archive" "https://github.com/mcpp-community/mcpp/releases/download/$version/mcpp-linux-x86_64.tar.gz"
        echo "344ee725639f62daedb1a18a62542af58a6a04c3fb9dc2b0c8dd879ddf232970  $archive" | sha256sum -c -
        mkdir -p "$RUNNER_TEMP/mcpp" && tar -xzf "$archive" -C "$RUNNER_TEMP/mcpp"
        echo "MCPP=$(find "$RUNNER_TEMP/mcpp" -type f -name mcpp -perm -u+x | head -1)" >> "$GITHUB_ENV"
        echo "MCPP_HOME=$RUNNER_TEMP/mcpp-home" >> "$GITHUB_ENV"
