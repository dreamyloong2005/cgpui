name: Setup Phase J dependencies
description: Pin build tools for release verification.

inputs:
  platform:
    description: Dependency root platform directory.
    required: true

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - uses: ./.github/actions/setup-mcpp
    - name: Configure the Windows mcpp environment
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        . ./scripts/ci/windows-dependencies.ps1
        Set-CgpuiWindowsDependencyEnvironment -ExportGitHubEnvironment | Out-Null
    - name: Configure the Linux mcpp environment
      if: runner.os == 'Linux'
      shell: bash
      run: bash ./scripts/ci/linux-dependencies.sh --github-env
