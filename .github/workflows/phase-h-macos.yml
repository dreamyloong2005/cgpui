name: Phase H macOS

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-full-debug:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # mcpp has no macOS row in .github/actions/setup-mcpp yet; these
      # jobs need an mcpp on PATH (not run since the mcpp migration).
      - name: Run complete macOS Debug verification
        run: bash ./scripts/ci/macos-debug.sh

  macos-examples-smoke:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # mcpp has no macOS row in .github/actions/setup-mcpp yet; these
      # jobs need an mcpp on PATH (not run since the mcpp migration).
      - name: Build and run macOS examples and smoke tests
        run: bash ./scripts/ci/macos-example-smoke.sh
