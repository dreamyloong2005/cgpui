name: Phase H macOS

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  MACOSX_DEPLOYMENT_TARGET: "26.0"

jobs:
  macos-full-debug:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-mcpp
      - name: Check the Apple clang module driver
        run: python3 -B tests/ci/macos_clang_toolchain_test.py
      - name: Run complete macOS Debug verification
        run: bash ./scripts/ci/macos-debug.sh

  macos-examples-smoke:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-mcpp
      - name: Build and run macOS examples and smoke tests
        run: bash ./scripts/ci/macos-example-smoke.sh
