name: Phase G Windows and Linux

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-debug:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-phase-g-dependencies
        with:
          platform: windows
      - name: Build and package Windows Debug
        shell: pwsh
        run: ./scripts/ci/windows-debug.ps1
      - name: Upload Windows Debug package
        uses: actions/upload-artifact@v4
        with:
          name: cgpui-windows-debug
          path: build/phase-g-ci/windows-debug/package
          if-no-files-found: error

  linux-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-phase-g-dependencies
        with:
          platform: linux
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev libfontconfig1-dev libvulkan-dev libwayland-dev meson ninja-build python3-venv
      - name: Build and package Linux Debug
        run: bash ./scripts/ci/linux-debug.sh
      - name: Upload Linux Debug package
        uses: actions/upload-artifact@v4
        with:
          name: cgpui-linux-debug
          path: build/phase-g-ci/linux-debug/package
          if-no-files-found: error

  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-phase-g-dependencies
        with:
          platform: windows
      - name: Build and package Windows Release
        shell: pwsh
        run: ./scripts/ci/windows-release.ps1
      - name: Upload Windows Release package
        uses: actions/upload-artifact@v4
        with:
          name: cgpui-windows-release
          path: build/phase-g-ci/windows-release/package
          if-no-files-found: error

  linux-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-phase-g-dependencies
        with:
          platform: linux
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev libfontconfig1-dev libvulkan-dev libwayland-dev meson ninja-build python3-venv
      - name: Build and package Linux Release
        run: bash ./scripts/ci/linux-release.sh
      - name: Upload Linux Release package
        uses: actions/upload-artifact@v4
        with:
          name: cgpui-linux-release
          path: build/phase-g-ci/linux-release/package
          if-no-files-found: error

  windows-examples-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-phase-g-dependencies
        with:
          platform: windows
      - name: Build and run Windows examples and smoke tests
        shell: pwsh
        run: ./scripts/ci/windows-example-smoke.ps1

  linux-examples-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-phase-g-dependencies
        with:
          platform: linux
      - name: Install Linux display and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev libfontconfig1-dev libvulkan-dev libwayland-dev mesa-vulkan-drivers meson ninja-build python3-venv weston
      - name: Build and run Linux examples and smoke tests
        run: bash ./scripts/ci/linux-example-smoke.sh

  windows-architecture-header:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-phase-g-dependencies
        with:
          platform: windows
      - name: Build and run Windows architecture and header tests
        shell: pwsh
        run: ./scripts/ci/windows-architecture-header.ps1

  linux-architecture-header:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-phase-g-dependencies
        with:
          platform: linux
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev libfontconfig1-dev libvulkan-dev libwayland-dev meson ninja-build python3-venv
      - name: Build and run Linux architecture and header tests
        run: bash ./scripts/ci/linux-architecture-header.sh
