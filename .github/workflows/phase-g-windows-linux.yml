name: Phase G Windows and Linux

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-debug:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test SDK installed-header closure and Windows driver fixtures
        shell: pwsh
        run: |
          python -B tests/ci/sdk_package_headers_test.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B tests/ci/dx12_package_graph_test.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($hostName in @('pwsh', 'powershell.exe')) {
            $env:CGPUI_DRIVER_TEST_POWERSHELL = (Get-Command $hostName -CommandType Application -ErrorAction Stop).Source
            python -B -m unittest discover -s tests/ci -p "windows_test_driver*test.py" -v
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - uses: ./.github/actions/setup-phase-g-dependencies
        with:
          platform: windows
      - name: Build and package Windows Debug
        shell: pwsh
        run: ./scripts/ci/windows-debug.ps1
      - name: Upload Windows Debug package
        uses: actions/upload-artifact@v4
        with:
          name: cgpui-windows-debug
          path: build/phase-g-ci/windows-debug/package
          if-no-files-found: error

  linux-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test SDK installed-header closure
        run: |
          python3 -B tests/ci/sdk_package_headers_test.py
          python3 -B tests/ci/dx12_package_graph_test.py
      - name: Test CI error annotations
        run: bash ./tests/ci/run_with_github_annotation_test.sh
      - uses: ./.github/actions/setup-phase-g-dependencies
        with:
          platform: linux
      - name: Verify GCC for the Linux build program and target
        run: bash ./scripts/ci/run-with-github-annotation.sh "$RUNNER_TEMP/linux-gcc-probe.log" -- python3 ./tests/ci/linux_gcc_toolchain_test.py
      - name: Build and package Linux Debug
        run: bash ./scripts/ci/run-with-github-annotation.sh "$RUNNER_TEMP/linux-debug.log" -- bash ./scripts/ci/linux-debug.sh
      - name: Upload Linux Debug package
        uses: actions/upload-artifact@v4
        with:
          name: cgpui-linux-debug
          path: build/phase-g-ci/linux-debug/package
          if-no-files-found: error

  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-phase-g-dependencies
        with:
          platform: windows
      - name: Build and package Windows Release
        shell: pwsh
        run: ./scripts/ci/windows-release.ps1
      - name: Upload Windows Release package
        uses: actions/upload-artifact@v4
        with:
          name: cgpui-windows-release
          path: build/phase-g-ci/windows-release/package
          if-no-files-found: error

  linux-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-phase-g-dependencies
        with:
          platform: linux
      - name: Build and package Linux Release
        run: bash ./scripts/ci/run-with-github-annotation.sh "$RUNNER_TEMP/linux-release.log" -- bash ./scripts/ci/linux-release.sh
      - name: Upload Linux Release package
        uses: actions/upload-artifact@v4
        with:
          name: cgpui-linux-release
          path: build/phase-g-ci/linux-release/package
          if-no-files-found: error

  windows-examples-smoke:
    runs-on: windows-latest
    env:
      CGPUI_RENDERER: vulkan
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-phase-g-dependencies
        with:
          platform: windows
      - name: Enable software Vulkan for the hosted Win32 smoke tests
        shell: bash
        run: bash ./scripts/ci/run-with-github-annotation.sh "$RUNNER_TEMP/windows-vulkan.log" -- pwsh -NoProfile -File ./scripts/ci/windows-software-vulkan.ps1
      - name: Build and run Windows examples and smoke tests
        shell: bash
        run: bash ./scripts/ci/run-with-github-annotation.sh "$RUNNER_TEMP/windows-smoke.log" -- pwsh -NoProfile -File ./scripts/ci/windows-example-smoke.ps1

  linux-examples-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-phase-g-dependencies
        with:
          platform: linux
      - name: Install the headless Wayland smoke environment
        run: sudo apt-get install -y mesa-vulkan-drivers weston fonts-dejavu-core fonts-wqy-zenhei
      - name: Build and run Linux examples and smoke tests
        run: bash ./scripts/ci/run-with-github-annotation.sh "$RUNNER_TEMP/linux-example-smoke.log" -- bash ./scripts/ci/linux-example-smoke.sh

  windows-architecture-header:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-phase-g-dependencies
        with:
          platform: windows
      - name: Build and run Windows architecture and header tests
        shell: pwsh
        run: ./scripts/ci/windows-architecture-header.ps1

  linux-architecture-header:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-phase-g-dependencies
        with:
          platform: linux
      - name: Build and run Linux architecture and header tests
        run: bash ./scripts/ci/run-with-github-annotation.sh "$RUNNER_TEMP/linux-architecture-header.log" -- bash ./scripts/ci/linux-architecture-header.sh
