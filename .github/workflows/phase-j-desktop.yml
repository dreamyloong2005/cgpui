name: Phase J macOS Completion

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CGPUI_EXPECTED_ARCH: arm64
  MACOSX_DEPLOYMENT_TARGET: "26.0"
  CGPUI_CI_TMPDIR: ${{ github.workspace }}/build/phase-j-ci/tmp

jobs:
  macos-debug-examples:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-phase-j-dependencies
        with:
          platform: macos
      - run: bash ./scripts/ci/run-with-github-annotation.sh "$RUNNER_TEMP/macos-debug.log" -- bash ./scripts/ci/macos-debug.sh build/phase-j-ci/macos-arm64-debug
      - run: bash ./scripts/ci/run-with-github-annotation.sh "$RUNNER_TEMP/macos-examples.log" -- bash ./scripts/ci/macos-example-smoke.sh

  macos-performance-stress:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-phase-j-dependencies
        with:
          platform: macos
      - run: bash ./scripts/ci/run-with-github-annotation.sh "$RUNNER_TEMP/macos-performance.log" -- bash ./scripts/ci/macos-performance-baseline.sh
      - run: bash ./scripts/ci/run-with-github-annotation.sh "$RUNNER_TEMP/macos-stress.log" -- bash ./scripts/ci/macos-stress-matrix.sh
      - uses: actions/upload-artifact@v4
        with:
          name: phase-j-macos-arm64-reports
          path: |
            artifacts/phase-j-performance/macos-arm64.json
            artifacts/phase-j-stress/macos-arm64.json
          if-no-files-found: error

  macos-release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-phase-j-dependencies
        with:
          platform: macos
      - run: python3 tests/ci/macos_sdk_arch_test.py
      - run: python3 -B tests/ci/sdk_package_headers_test.py
      - run: bash ./scripts/ci/run-with-github-annotation.sh "$RUNNER_TEMP/macos-release.log" -- bash ./scripts/ci/macos-phase-j-release.sh arm64
      - uses: actions/upload-artifact@v4
        with:
          name: cgpui-macos-arm64-release
          path: build/phase-j-release/macos-arm64/artifacts
          if-no-files-found: error

  macos-architecture-header:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-phase-j-dependencies
        with:
          platform: macos
      - run: bash ./scripts/ci/run-with-github-annotation.sh "$RUNNER_TEMP/macos-architecture.log" -- bash ./scripts/ci/macos-architecture-header.sh
