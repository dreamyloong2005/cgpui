name: Phase J Desktop Release

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CGPUI_CI_TMPDIR: ${{ github.workspace }}/build/phase-j-ci/tmp

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-phase-j-dependencies
        with:
          platform: windows
      - name: Build deterministic Windows release artifact
        shell: pwsh
        run: ./scripts/ci/windows-phase-j-release.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: cgpui-windows-release
          path: build/phase-j-release/windows/artifacts
          if-no-files-found: error

  linux-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-phase-j-dependencies
        with:
          platform: linux
      - name: Install Linux release dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev libfontconfig1-dev libvulkan-dev libwayland-dev libxcb1-dev libxcb-cursor-dev libxcb-xkb-dev libxkbcommon-x11-dev meson ninja-build python3-venv
      - name: Build deterministic Linux release artifact
        run: bash ./scripts/ci/linux-phase-j-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: cgpui-linux-release
          path: build/phase-j-release/linux/artifacts
          if-no-files-found: error

  windows-performance:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-phase-j-dependencies
        with:
          platform: windows
      - shell: pwsh
        run: ./scripts/ci/windows-performance-baseline.ps1
      - shell: pwsh
        run: ./scripts/ci/windows-stress-matrix.ps1

  linux-wayland-performance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-phase-j-dependencies
        with:
          platform: linux
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev libfontconfig1-dev libvulkan-dev libwayland-dev libxcb1-dev libxcb-cursor-dev libxcb-xkb-dev libxkbcommon-x11-dev meson ninja-build python3-venv
      - run: CGPUI_LINUX_BACKEND=wayland bash ./scripts/ci/linux-performance-baseline.sh

  linux-x11-performance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-phase-j-dependencies
        with:
          platform: linux
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev libfontconfig1-dev libvulkan-dev libwayland-dev libxcb1-dev libxcb-cursor-dev libxcb-xkb-dev libxkbcommon-x11-dev meson ninja-build python3-venv
      - run: CGPUI_LINUX_BACKEND=x11 bash ./scripts/ci/linux-performance-baseline.sh

  linux-wayland-stress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-phase-j-dependencies
        with:
          platform: linux
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev libfontconfig1-dev libvulkan-dev libwayland-dev libxcb1-dev libxcb-cursor-dev libxcb-xkb-dev libxkbcommon-x11-dev meson ninja-build python3-venv
      - run: CGPUI_LINUX_BACKEND=wayland bash ./scripts/ci/linux-stress-matrix.sh

  linux-x11-stress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-phase-j-dependencies
        with:
          platform: linux
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev libfontconfig1-dev libvulkan-dev libwayland-dev libxcb1-dev libxcb-cursor-dev libxcb-xkb-dev libxkbcommon-x11-dev meson ninja-build python3-venv
      - run: CGPUI_LINUX_BACKEND=x11 bash ./scripts/ci/linux-stress-matrix.sh

  windows-examples:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-phase-j-dependencies
        with:
          platform: windows
      - shell: pwsh
        run: ./scripts/ci/windows-example-smoke.ps1

  linux-wayland-examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-phase-j-dependencies
        with:
          platform: linux
      - name: Install Linux display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev libfontconfig1-dev libvulkan-dev libwayland-dev libxcb1-dev libxcb-cursor-dev libxcb-xkb-dev libxkbcommon-x11-dev mesa-vulkan-drivers meson ninja-build python3-venv weston
      - run: bash ./scripts/ci/linux-example-smoke.sh

  linux-x11-examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-phase-j-dependencies
        with:
          platform: linux
      - name: Install X11 display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev libfontconfig1-dev libvulkan-dev libwayland-dev libxcb1-dev libxcb-cursor-dev libxcb-xkb-dev libxkbcommon-x11-dev mesa-vulkan-drivers meson ninja-build python3-venv xvfb
      - run: bash ./scripts/ci/linux-x11-xvfb-example-smoke.sh

  architecture-header:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-phase-j-dependencies
        with:
          platform: ${{ runner.os == 'Windows' && 'windows' || 'linux' }}
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev libfontconfig1-dev libvulkan-dev libwayland-dev libxcb1-dev libxcb-cursor-dev libxcb-xkb-dev libxkbcommon-x11-dev meson ninja-build python3-venv
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/ci/windows-architecture-header.ps1
      - if: runner.os == 'Linux'
        run: bash ./scripts/ci/linux-architecture-header.sh

  macos-debug-examples:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    env:
      CGPUI_EXPECTED_ARCH: ${{ matrix.arch }}
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-phase-j-dependencies
        with:
          platform: macos
      - run: test "$(uname -m)" = "$CGPUI_EXPECTED_ARCH"
      - run: bash ./scripts/ci/macos-debug.sh build/phase-j-ci/macos-${{ matrix.arch }}-debug
      - run: bash ./scripts/ci/macos-example-smoke.sh

  macos-performance-stress:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    env:
      CGPUI_EXPECTED_ARCH: ${{ matrix.arch }}
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-phase-j-dependencies
        with:
          platform: macos
      - run: test "$(uname -m)" = "$CGPUI_EXPECTED_ARCH"
      - run: bash ./scripts/ci/macos-performance-baseline.sh
      - run: bash ./scripts/ci/macos-stress-matrix.sh
      - uses: actions/upload-artifact@v4
        with:
          name: phase-j-macos-${{ matrix.arch }}-reports
          path: |
            artifacts/phase-j-performance/macos-${{ matrix.arch }}.json
            artifacts/phase-j-stress/macos-${{ matrix.arch }}.json
          if-no-files-found: error

  macos-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    env:
      CGPUI_EXPECTED_ARCH: ${{ matrix.arch }}
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-phase-j-dependencies
        with:
          platform: macos
      - run: test "$(uname -m)" = "$CGPUI_EXPECTED_ARCH"
      - run: bash ./scripts/ci/macos-phase-j-release.sh ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: cgpui-macos-${{ matrix.arch }}-release
          path: build/phase-j-release/macos-${{ matrix.arch }}/artifacts
          if-no-files-found: error

  macos-architecture-header:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    env:
      CGPUI_EXPECTED_ARCH: ${{ matrix.arch }}
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-phase-j-dependencies
        with:
          platform: macos
      - run: test "$(uname -m)" = "$CGPUI_EXPECTED_ARCH"
      - run: bash ./scripts/ci/macos-architecture-header.sh
