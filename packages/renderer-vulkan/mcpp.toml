[package]
namespace = "cgpui"
name = "renderer-vulkan"
version = "0.1.0"

[targets.cgpui_renderer_vulkan]
kind = "lib"

[dependencies]
cgpui.core = { path = "../core" }
cgpui.platform = { path = "../platform" }
cgpui.renderer = { path = "../renderer" }

[build]
include_dirs = ["../../include"]
sources = []

[target.'cfg(any(os = "windows", os = "linux"))'.build]
sources = ["../../src/renderer/vulkan/*.cpp"]

[target.'cfg(not(any(os = "windows", os = "linux")))'.build]
sources = ["../../tools/mcpp/empty_library.cpp"]

[build-dependencies]
cgpui.build-support = { path = "../../tools/mcpp" }
