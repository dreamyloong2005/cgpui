# Wayland backend (Linux); selects X11 at run time when asked.
[package]
namespace = "cgpui"
name = "platform-linux-wayland"
version = "0.1.0"

[targets.cgpui_platform_linux_wayland]
kind = "lib"

[dependencies]
cgpui.core = { path = "../core" }
cgpui.platform = { path = "../platform" }
cgpui.platform-linux-atspi = { path = "../platform-linux-atspi" }
cgpui.platform-linux-x11 = { path = "../platform-linux-x11" }

[build]
include_dirs = ["../../include"]
sources = []

[target.'cfg(os = "linux")'.build]
sources = [
    "../../src/platform/linux/*.cpp",
    "!../../src/platform/linux/linux_atspi_api.cpp",
    "!../../src/platform/linux/linux_backend_selection.cpp",
    "!../../src/platform/linux/wayland_accessibility*.cpp",
    "!../../src/platform/linux/wayland_atspi*.cpp",
]
defines = ["CGPUI_HAS_FONTCONFIG_DISCOVERY_BACKEND"]

[target.'cfg(not(os = "linux"))'.build]
sources = ["../../tools/mcpp/empty_library.cpp"]

[build-dependencies]
cgpui.build-support = { path = "../../tools/mcpp" }
