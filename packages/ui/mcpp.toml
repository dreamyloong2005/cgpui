# Elements, layout, editing, widgets, and the window runtime.
[package]
namespace = "cgpui"
name = "ui"
version = "0.1.0"

[targets.cgpui_ui]
kind = "lib"

[dependencies]
cgpui.core = { path = "../core" }
cgpui.platform = { path = "../platform" }
cgpui.renderer = { path = "../renderer" }

[build]
include_dirs = ["../../include"]
sources = [
    "../../src/ui/*.cpp",
    "../../src/ui/widgets/*.cpp",
    "../../src/ui/workbench/*.cpp",
]
