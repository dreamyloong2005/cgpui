[package]
namespace = "cgpui"
name = "platform-win32"
version = "0.1.0"

[targets.cgpui_platform_win32]
kind = "lib"

[dependencies]
cgpui.core = { path = "../core" }
cgpui.platform = { path = "../platform" }

# popup_windows_supported() probes the DirectComposition presentation.
[target.'cfg(os = "windows")'.dependencies]
cgpui.renderer-win32-composition = { path = "../renderer-win32-composition" }

[build]
include_dirs = ["../../include"]
sources = []

[target.'cfg(os = "windows")'.build]
sources = ["../../src/platform/win32/*.cpp"]
ldflags = [
    "user32.lib",
    "gdi32.lib",
    "shell32.lib",
    "imm32.lib",
    "ole32.lib",
    "oleaut32.lib",
    "dwrite.lib",
    "uiautomationcore.lib",
    "uuid.lib",
    "dwmapi.lib",
    "advapi32.lib",
]

[target.'cfg(not(os = "windows"))'.build]
sources = ["../../tools/mcpp/empty_library.cpp"]
