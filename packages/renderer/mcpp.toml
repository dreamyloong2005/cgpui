# Renderer-neutral drawing, SVG, shaping, layout, and glyph rasterization.
[package]
namespace = "cgpui"
name = "renderer"
version = "0.1.0"

[targets.cgpui_renderer]
kind = "lib"

[dependencies]
cgpui.core = { path = "../core" }
cgpui.platform = { path = "../platform" }
vendor.lunasvg = { path = "../../third_party/lunasvg" }

[build]
include_dirs = ["../../include", "../../third_party/stb"]
private_include_dirs = ["../../third_party/stb"]
sources = [
    "../../src/renderer/*.cpp",
    "../../src/renderer/planning/*.cpp",
    "!../../src/renderer/renderer_unimplemented.cpp",
    "../../src/renderer/text/text_shaping_backend.cpp",
    "../../src/renderer/text/text_shaping_dispatch.cpp",
    "../../src/renderer/text/text_shaping_harfbuzz.cpp",
    "../../src/renderer/text/text_shaping_fallback.cpp",
    "../../src/renderer/text/text_shape.cpp",
    "../../src/renderer/text/text_rich_text.cpp",
    "../../src/renderer/text/text_rich_text_inline_image.cpp",
    "../../src/renderer/text/text_glyph_raster.cpp",
    "../../src/renderer/text/text_measurement.cpp",
    "../../src/renderer/text/text_line_metrics.cpp",
    "../../src/renderer/text/text_paragraph_layout.cpp",
    "../../src/renderer/text/text_measurement_grapheme.cpp",
    "../../src/renderer/text/text_measurement_bidi.cpp",
    "../../src/renderer/text/text_wrapping.cpp",
    "../../src/renderer/text/text_hit_testing.cpp",
    "../../src/renderer/text/text_shaping_native.cpp",
    "../../src/renderer/text/text_shaping_unicode.cpp",
    "../../src/renderer/text/text_shape_cache.cpp",
    "../../src/renderer/text/text_shaping_directwrite.cpp",
    "../../src/renderer/text/text_font_defaults.cpp",
    "../../src/renderer/text/text_glyph_rasterizer.cpp",
]

[target.'cfg(os = "windows")'.build]
sources = [
    "../../src/renderer/text/text_dwrite_fonts_win32.cpp",
    "../../src/renderer/text/text_dwrite_analysis_win32.cpp",
    "../../src/renderer/text/text_glyph_id_raster_win32.cpp",
    "../../src/renderer/text/text_glyph_raster_win32.cpp",
    "../../src/renderer/text/text_glyph_coverage_win32.cpp",
]
ldflags = ["dwrite.lib"]

[target.'cfg(os = "linux")'.build]
sources = [
    "../../src/renderer/text/text_fontconfig_faces_linux.cpp",
    "../../src/renderer/text/text_glyph_id_raster_freetype.cpp",
]
defines = [
    "CGPUI_HAS_HARFBUZZ_SHAPING_BACKEND",
    "CGPUI_HAS_FREETYPE_GLYPH_RASTERIZER",
]

[target.'cfg(os = "macos")'.build]
sources = [
    "../../src/renderer/text/text_shaping_coretext_macos.cpp",
    "../../src/renderer/text/text_coretext_fonts_macos.cpp",
    "../../src/renderer/text/text_glyph_id_raster_coretext.cpp",
]

[target.'cfg(os = "macos")'.runtime]
frameworks = ["CoreText", "CoreGraphics", "CoreFoundation"]

[build-dependencies]
cgpui.build-support = { path = "../../tools/mcpp" }
