# tests/platform: Platform services and the Win32 / Wayland / X11 backends.
# Every test program is named in [test] discover (registration is explicit,
# as it was with xmake targets; structure tests check these entries).
# build.mcpp defines CGPUI_SOURCE_ROOT for tests that read repository files.
[package]
namespace = "cgpui"
name = "tests-platform"
version = "0.1.0"

[targets.cgpui_tests_platform_support]
kind = "lib"

[dependencies]
cgpui.core = { path = "../../packages/core" }
cgpui.platform = { path = "../../packages/platform" }
cgpui.renderer = { path = "../../packages/renderer" }
cgpui.ui = { path = "../../packages/ui" }

[target.'cfg(os = "windows")'.dependencies]
cgpui.platform-win32 = { path = "../../packages/platform-win32" }
cgpui.renderer-vulkan = { path = "../../packages/renderer-vulkan" }
cgpui.app = { path = "../../packages/app" }

[target.'cfg(os = "linux")'.dependencies]
cgpui.platform-linux-wayland = { path = "../../packages/platform-linux-wayland" }

[target.'cfg(os = "macos")'.dependencies]
cgpui.platform-macos = { path = "../../packages/platform-macos" }
cgpui.renderer-metal = { path = "../../packages/renderer-metal" }

[build-dependencies]
cgpui.build-support = { path = "../../tools/mcpp" }

[build]
sources = []
include_dirs = [
    "../../src/platform",
    "../../src/platform/linux",
    "../../tests/ui",
]

[target.'cfg(os = "windows")'.build]
sources = [
    "../../src/platform/linux/linux_backend_selection.cpp",
]
include_dirs = [
    "../../src/platform/win32",
]
# win32_clipboard_contention_test raises the timer resolution (timeBeginPeriod).
ldflags = ["winmm.lib"]

[target.'cfg(os = "linux")'.build]
sources = [
    "wayland_test_compositor.cpp",
    "wayland_fake_portal.cpp",
    "wayland_private_session_bus.cpp",
    "wayland_test_background_effect.cpp",
]
include_dirs = [
    "../../src/platform/linux/x11",
    ".",
]

[target.'cfg(os = "macos")'.build]
# The backend-selection policy test is shared and needs no Linux libraries.
# On Linux the platform package already compiles this translation unit.
sources = ["../../src/platform/linux/linux_backend_selection.cpp"]
include_dirs = ["../../src/platform/macos"]

[test]
discover = [
    "clipboard_test.cpp",
    "linux_backend_selection_test.cpp",
    "platform_font_discovery_test.cpp",
    "platform_popup_placement_test.cpp",
    "platform_reopen_lifecycle_test.cpp",
]

[target.'cfg(os = "windows")'.test]
