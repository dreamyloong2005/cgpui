# tests/header_cleanliness: Each program includes one public header and nothing else.
# Every test program is named in [test] discover (registration is explicit,
# as it was with xmake targets; structure tests check these entries).
# build.mcpp defines CGPUI_SOURCE_ROOT for tests that read repository files.
[package]
namespace = "cgpui"
name = "tests-header-cleanliness"
version = "0.1.0"

[dependencies]
cgpui.core = { path = "../../packages/core" }
cgpui.platform = { path = "../../packages/platform" }
cgpui.renderer = { path = "../../packages/renderer" }
cgpui.ui = { path = "../../packages/ui" }
cgpui.app = { path = "../../packages/app" }

[build-dependencies]
cgpui.build-support = { path = "../../tools/mcpp" }

[build]
sources = []

[test]
discover = [
    "planning_backdrop_blur_vertex_header_test.cpp",
    "planning_backdrop_blur_pass_header_test.cpp",
    "planning_backdrop_blur_plan_header_test.cpp",
    "planning_backdrop_blur_parameters_header_test.cpp",
    "planning_box_shadow_vertex_header_test.cpp",
    "planning_box_shadow_geometry_header_test.cpp",
    "planning_box_shadow_parameters_header_test.cpp",
    "planning_image_vertex_header_test.cpp",
    "planning_image_geometry_header_test.cpp",
    "planning_image_color_header_test.cpp",
    "planning_text_vertex_header_test.cpp",
    "planning_text_geometry_header_test.cpp",
    "planning_text_positioning_header_test.cpp",
    "renderer_backend_header_test.cpp",
    "runtime_installed_include_consumer.cpp",
    "text_ownership_header_test.cpp",
    "action_macros_header_cleanliness.cpp",
    "app_header_cleanliness.cpp",
    "async_asset_loading_header_cleanliness.cpp",
    "core_header_cleanliness.cpp",
    "core_window_backdrop_header_cleanliness.cpp",
    "core_window_title_bar_header_cleanliness.cpp",
    "platform_appearance_header_cleanliness.cpp",
    "platform_dpi_awareness_header_cleanliness.cpp",
    "platform_window_backdrop_header_cleanliness.cpp",
    "platform_window_title_bar_header_cleanliness.cpp",
    "prelude_header_cleanliness.cpp",
    "renderer_effect_draws_header_cleanliness.cpp",
    "renderer_surface_composition_header_cleanliness.cpp",
    "style_font_header_cleanliness.cpp",
