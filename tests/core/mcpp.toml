# tests/core: Core entity store tests.
# Every test program is named in [test] discover (registration is explicit,
# as it was with xmake targets; structure tests check these entries).
# build.mcpp defines CGPUI_SOURCE_ROOT for tests that read repository files.
[package]
namespace = "cgpui"
name = "tests-core"
version = "0.1.0"

[dependencies]
cgpui.core = { path = "../../packages/core" }

[build-dependencies]
cgpui.build-support = { path = "../../tools/mcpp" }

[build]
sources = []

[test]
discover = [
    "entity_store_test.cpp",
    "native_window_work_test.cpp",
    "native_window_work_reentry_test.cpp",
    "native_window_work_thread_test.cpp",
]
