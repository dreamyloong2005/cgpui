# Experimental native DX12 acceptance; never substitutes for Vulkan regression.
[package]
namespace = "cgpui"
name = "tests-renderer-dx12"
version = "0.1.0"

[targets.cgpui_tests_renderer_dx12_support]
kind = "lib"

[dependencies]
cgpui.renderer = { path = "../../packages/renderer" }

[build]
sources = []

[test]
discover = []

[target.'cfg(os = "windows")'.build]
sources = [
    "dx12_runtime_pacing_capture_test_support.cpp",
    "dx12_runtime_pacing_scene_test_support.cpp",
    "dx12_runtime_pacing_loop_test_support.cpp",
    "dx12_pacing_control_test_support.cpp",
    "../support/frame_wait_test_support.cpp",
    "../support/frame_wait_win32_test_support.cpp",
    "dx12_pacing_begin_wait_test_support.cpp",
    "dx12_pacing_begin_case_test_support.cpp",
    "dx12_pacing_script_test_support.cpp",
    "dx12_pacing_native_api_test_support.cpp",
    "dx12_pacing_native_setup_test_support.cpp",
    "dx12_pacing_native_frame_test_support.cpp",
    "dx12_backdrop_fallback_test_support.cpp",
    "dx12_backdrop_fallback_diagnostics_test_support.cpp",
    "dx12_runtime_capture_test_support.cpp",
    "dx12_runtime_recovery_scene_test_support.cpp",
    "dx12_runtime_recovery_loop_test_support.cpp",
]
ldflags = ["user32.lib", "gdi32.lib"]

[target.'cfg(not(os = "windows"))'.build]
sources = ["../../tools/mcpp/empty_library.cpp"]

[target.'cfg(os = "windows")'.dependencies]
cgpui.ui = { path = "../../packages/ui" }
cgpui.platform = { path = "../../packages/platform" }
cgpui.platform-win32 = { path = "../../packages/platform-win32" }
cgpui.renderer-dx12 = { path = "../../packages/renderer-dx12" }
cgpui.renderer-windows = { path = "../../packages/renderer-windows" }

