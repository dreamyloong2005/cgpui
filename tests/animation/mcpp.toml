# tests/animation: Animation tests.
# Every test program is named in [test] discover (registration is explicit,
# as it was with xmake targets; structure tests check these entries).
# build.mcpp defines CGPUI_SOURCE_ROOT for tests that read repository files.
[package]
namespace = "cgpui"
name = "tests-animation"
version = "0.1.0"

[dependencies]
cgpui.core = { path = "../../packages/core" }
cgpui.platform = { path = "../../packages/platform" }
cgpui.renderer = { path = "../../packages/renderer" }
cgpui.ui = { path = "../../packages/ui" }

[build-dependencies]
cgpui.build-support = { path = "../../tools/mcpp" }

[build]
sources = []
include_dirs = [
    "../../tests/ui",
]

[test]
discover = [
    "animation_cancellation_test.cpp",
    "animation_curve_variant_test.cpp",
    "animation_frame_pacing_test.cpp",
    "element_animation_sequence_test.cpp",
    "element_lifecycle_animation_test.cpp",
    "runtime_animation_transition_test.cpp",
    "style_interpolation_test.cpp",
]
