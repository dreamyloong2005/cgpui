# tests/renderer: shared renderer contracts and backend-specific regression tests.
# Every test program is named in [test] discover (registration is explicit,
# as it was with xmake targets; structure tests check these entries).
# build.mcpp defines CGPUI_SOURCE_ROOT for tests that read repository files.
[package]
namespace = "cgpui"
name = "tests-renderer"
version = "0.1.0"

[targets.cgpui_tests_renderer_support]
kind = "lib"

[dependencies]
cgpui.core = { path = "../../packages/core" }
cgpui.platform = { path = "../../packages/platform" }
cgpui.renderer = { path = "../../packages/renderer" }
cgpui.renderer-vulkan = { path = "../../packages/renderer-vulkan" }
cgpui.ui = { path = "../../packages/ui" }

[target.'cfg(os = "windows")'.dependencies]
cgpui.renderer-dx12 = { path = "../../packages/renderer-dx12" }
cgpui.platform-win32 = { path = "../../packages/platform-win32" }
cgpui.renderer-win32-composition = { path = "../../packages/renderer-win32-composition" }

[target.'cfg(os = "linux")'.dependencies]
cgpui.platform-linux-wayland = { path = "../../packages/platform-linux-wayland" }

[target.'cfg(os = "macos")'.dependencies]
cgpui.platform-macos = { path = "../../packages/platform-macos" }
cgpui.renderer-metal = { path = "../../packages/renderer-metal" }

[build-dependencies]
cgpui.build-support = { path = "../../tools/mcpp" }

[build]
sources = [
    "../support/frame_wait_test_support.cpp",
    "renderer_box_shadow_pixel_support.cpp",
    "renderer_text_pixel_shape_support.cpp",
    "renderer_pixel_test_probes.cpp",
]
include_dirs = [
    "../../src/renderer",
    "../../src/renderer/vulkan",
    "../../src/ui",
    ".",
]

# Native shared pixel harness; no Win32/DX12 source enters Linux or Metal builds.
[target.'cfg(os = "windows")'.build]
sources = [
    "../support/frame_wait_win32_test_support.cpp",
    "renderer_pixel_test_backend_policy.cpp",
    "renderer_pixel_test_backend.cpp",
    "renderer_pixel_test_window.cpp",
    "renderer_pixel_test_capture.cpp",
    "renderer_backdrop_pass_test_support.cpp",
]

# Private headers for the native Metal pixel tests.
[target.'cfg(os = "macos")'.build]
include_dirs = ["../../src/renderer/metal", "metal"]

[test]
discover = [
    "renderer_retained_image_diagnostics_test.cpp",
    "renderer_frame_wait_contract_test.cpp",
    "renderer_popup_support_test.cpp",
    "renderer_draw_count_diagnostics_test.cpp",
    "renderer_dropped_resource_diagnostics_test.cpp",
    "renderer_frame_diagnostics_test.cpp",
    "renderer_frame_pixels_test.cpp",
    "renderer_frame_timing_diagnostics_test.cpp",
    "renderer_upload_byte_diagnostics_test.cpp",
    "svg_image_upload_integration_test.cpp",
    "svg_lunasvg_rasterization_test.cpp",
    "svg_raster_cache_test.cpp",
    "svg_rasterization_plan_test.cpp",
    "svg_recolor_tint_test.cpp",
    "svg_viewport_scaling_test.cpp",
]

# Windows and Linux only (Vulkan, or a backend macOS does not have).
[target.'cfg(any(os = "windows", os = "linux"))'.test]
discover = [
    "native_text_glyph_spacing_test.cpp",
    "vulkan_backdrop_blur_plan_test.cpp",
