# tests/ui: Elements, layout, text, widgets and the window runtime.
# Every test program is named in [test] discover (registration is explicit,
# as it was with xmake targets; structure tests check these entries).
# build.mcpp defines CGPUI_SOURCE_ROOT for tests that read repository files.
[package]
namespace = "cgpui"
name = "tests-ui"
version = "0.1.0"

[targets.cgpui_tests_ui_support]
kind = "lib"

[dependencies]
cgpui.core = { path = "../../packages/core" }
cgpui.platform = { path = "../../packages/platform" }
cgpui.renderer = { path = "../../packages/renderer" }
cgpui.ui = { path = "../../packages/ui" }
cgpui.app = { path = "../../packages/app" }

[build-dependencies]
cgpui.build-support = { path = "../../tools/mcpp" }

[build]
sources = [
    "native_text_shaping_reference.cpp",
]
include_dirs = [
    "../../src/ui",
    ".",
]

[target.'cfg(os = "linux")'.build]
defines = [
    "CGPUI_HAS_HARFBUZZ_SHAPING_BACKEND",
]

[test]
discover = [
    "accessibility_pattern_action_test.cpp",
    "accessibility_pattern_runtime_test.cpp",
    "action_bubbling_test.cpp",
    "action_enablement_metadata_test.cpp",
